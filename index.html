<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UFC Catch-Up</title>
<style>
:root{--bg:#14110f;--card:#1e1a17;--line:#332d28;--text:#f2ede6;--dim:#9a9086;--red:#d6281f;--ok:#5fb37c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 40px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:800 28px/1.1 "Arial Narrow",Impact,system-ui,sans-serif;letter-spacing:.01em;margin:8px 0 2px}
.sub{color:var(--dim);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font:800 54px/1 "Arial Narrow",Impact,system-ui,sans-serif;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
button,select,input{font:inherit;color:var(--text);background:#2a2420;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button.pri{background:var(--red);border-color:var(--red);font-weight:700}
button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ev{display:flex;align-items:center;gap:12px;padding:12px 14px}
.ev.done{opacity:.55}.ev.done .t{text-decoration:line-through}
.chk{width:40px;height:40px;padding:0;font-size:20px;flex:none}.ev.done .chk{background:var(--ok);color:#10201a;border-color:var(--ok)}
.t{font-weight:700}.m{color:var(--dim);font-size:13px}
.ppv{color:#e8b04a}.up{font-style:italic}
details summary{cursor:pointer;color:var(--dim)}
#msg{color:var(--dim);text-align:center;padding:24px 8px}
</style></head><body><main>
<h1>UFC catch-up</h1>
<p class="sub">Only event names and dates. No fighters, no results.</p>

<div class="card"><div class="big" id="behind">0</div>
<div>events behind you</div>
<div class="m"><span id="watched">0</span> watched of <span id="total">0</span> past events</div>
<div class="bar"><i id="bar"></i></div></div>

<div class="card" id="next" hidden>
<div class="m">Watch next · <span id="nextDate"></span></div>
<div class="t" id="nextTitle" style="font-size:20px;margin:4px 0 10px"></div>
<button class="pri" id="nextBtn">Mark as watched</button></div>

<div class="card"><details><summary>Where are you in the catch-up?</summary>
<p class="m">Pick the date of the last event you've seen. Everything on or before it is marked watched.</p>
<div class="row"><input type="date" id="cu"><button id="cuBtn">Mark as watched</button></div></details>
<details style="margin-top:10px"><summary>Add event, backup</summary>
<div class="row" style="margin-top:10px"><input id="ct" placeholder="Event title"><input type="date" id="cd"><button id="ca">Add</button></div>
<div class="row" style="margin-top:10px"><button id="ex">Export backup</button>
<label><button onclick="this.nextElementSibling.click()">Import backup</button><input type="file" id="im" hidden accept=".json"></label></div></details></div>

<div class="row" id="filters" style="margin-bottom:12px"></div>
<div id="list"></div><div id="msg" hidden></div>
</main>
<script>
const ESPN='https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard';
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let base=[],watched=load('ufc_watched_events',{}),custom=load('ufc_custom_events',[]),filter='all',desc=false;
const today=()=>new Date().toISOString().slice(0,10);

// Strips fighter names: numbered events keep "UFC 320", everything else becomes "UFC Fight Night"
function clean(e){
  const m=/UFC\s+(\d{3})\b/i.exec(e.name||'');
  const d=new Date(new Date(e.date).getTime()-6*36e5).toISOString().slice(0,10);
  return{id:String(e.id),title:m?'UFC '+m[1]:'UFC Fight Night',date:d,type:m?'ppv':'fn'};
}
async function loadBase(){
  try{const r=await fetch('events.json?'+Date.now());
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length)return j;}}catch(e){}
  try{const y=new Date().getFullYear(),end=new Date(Date.now()+180*864e5).toISOString().slice(0,10).replace(/-/g,'');
    const r=await fetch(`${ESPN}?dates=${y-1}0101-${end}&limit=500`);const j=await r.json();
    return (j.events||[]).map(clean);}catch(e){}
  return [];
}
const all=()=>[...base,...custom].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
function render(){
  const ev=all(),t=today(),past=ev.filter(e=>e.date<=t);
  const w=past.filter(e=>watched[e.id]).length,behind=past.length-w;
  $('#behind').textContent=behind;$('#watched').textContent=w;$('#total').textContent=past.length;
  $('#bar').style.width=(past.length?Math.round(w/past.length*100):0)+'%';
  const nx=past.find(e=>!watched[e.id]);$('#next').hidden=!nx;
  if(nx){$('#nextTitle').textContent=nx.title;$('#nextDate').textContent=nx.date;$('#nextBtn').onclick=()=>toggle(nx.id);}
  const F={all:'All',unwatched:'To watch',watched:'Watched',ppv:'Numbered',fn:'Fight Nights'};
  $('#filters').innerHTML=Object.entries(F).map(([k,v])=>`<button data-f="${k}" class="${k===filter?'on':''}">${v}</button>`).join('')+`<button data-s>${desc?'Newest first':'Oldest first'}</button>`;
  let l=ev.filter(e=>filter==='unwatched'?!watched[e.id]&&e.date<=t:filter==='watched'?watched[e.id]:filter==='ppv'?e.type==='ppv':filter==='fn'?e.type==='fn':true);
  if(desc)l.reverse();
  $('#list').innerHTML=l.map(e=>{const up=e.date>t,d=!!watched[e.id];
    return `<div class="card ev ${d?'done':''}"><button class="chk" data-id="${esc(e.id)}" ${up?'disabled':''} aria-label="Toggle watched">${d?'✓':''}</button>
    <div><div class="t ${e.type==='ppv'?'ppv':''}">${esc(e.title)}</div><div class="m ${up?'up':''}">${esc(e.date)}${up?' · upcoming':''}</div></div></div>`}).join('');
  const msg=$('#msg');msg.hidden=!!l.length;
  msg.textContent=ev.length?'Nothing matches this filter.':"Couldn't load the schedule. Check your connection, or add events under “Add event, backup”.";
}
function toggle(id){watched[id]=!watched[id];save('ufc_watched_events',watched);render();}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.id)toggle(b.dataset.id);
  else if(b.dataset.f){filter=b.dataset.f;render();}
  else if('s' in b.dataset){desc=!desc;render();}
});
$('#cuBtn').onclick=()=>{const d=$('#cu').value;if(!d)return;
  all().forEach(e=>{if(e.date<=d)watched[e.id]=true});save('ufc_watched_events',watched);render();};
$('#ca').onclick=()=>{const t=$('#ct').value.trim(),d=$('#cd').value;if(!t||!d)return;
  custom.push({id:'c'+Date.now(),title:t,date:d,type:'fn'});save('ufc_custom_events',custom);$('#ct').value='';render();};
$('#ex').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({watched,custom})],{type:'application/json'}));
  a.download='ufc-backup.json';a.click();};
$('#im').onchange=async ev=>{try{const j=JSON.parse(await ev.target.files[0].text());
  watched=j.watched||{};custom=j.custom||[];save('ufc_watched_events',watched);save('ufc_custom_events',custom);render();}
  catch(e){alert('That file is not a valid backup.');}};
render();
loadBase().then(l=>{base=l;render();});
</script></body></html>
